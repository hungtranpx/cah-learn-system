name: Build Hello Service
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/hello-service/**"
      - ".github/workflows/build-hello-service.yaml"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build Hello Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup image tag
        id: image-tag
        run: echo "value=$(date +'%Y%m%d')-${{ github.run_number }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend/hello-service
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ steps.image-tag.outputs.value }}
          tags: ghcr.io/${{ github.repository_owner }}/cah-learn-hello:${{ steps.image-tag.outputs.value }}

      - name: Show image
        run: echo "::notice title=Image::ghcr.io/${{ github.repository_owner }}/cah-learn-hello:${{ steps.image-tag.outputs.value }}"

      - name: Dispatch update to devops repo
        env:
          GH_TOKEN: ${{ secrets.DEVOPS_DISPATCH_TOKEN }}
        run: |
          gh workflow run update-image-on-trigger.yaml \
            --repo ${{ github.repository_owner }}/cah-learn-devops \
            --ref dev \
            -f serviceName=helloService \
            -f imageTag=${{ steps.image-tag.outputs.value }}
